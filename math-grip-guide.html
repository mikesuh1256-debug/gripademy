  <script>
    const slides=[
      {title:'매쓰그립 소개',duration:12.52,text:'안녕하세요. 손에 잡히는 수학, 매쓰그립입니다. 매쓰그립은 문제를 많이 풀게 하는 데서 멈추지 않습니다. 아이가 스스로 생각하고, 풀이를 설명하고, 자신의 힘으로 문제를 해결하도록 돕습니다.'},
      {title:'생각하는 훈련',duration:13.73,text:'수학 실력은 선생님의 풀이를 많이 보는 것만으로 자라지 않습니다. 스스로 고민하고, 풀이 과정을 쓰고, 피드백을 받아 다시 고치는 시간이 필요합니다. 매쓰그립은 바로 이 생각하는 시간을 수업의 중심에 둡니다.'},
      {title:'3단계 학습 과정',duration:17.48,text:'수업은 세 단계로 이어집니다. 먼저 디디, 피티 수업에서 개념을 정확히 이해합니다. 다음으로 디더블유 시간에 스스로 풀이를 쓰며 생각을 정리합니다. 마지막 디씨 코칭에서는 오답의 원인을 찾아, 자기 힘으로 다시 풀게 합니다.'},
      {title:'DD반과 PT반',duration:17.88,text:'학생마다 필요한 수업은 다릅니다. 디디반은 비슷한 실력의 학생들이 함께 개념과 심화를 깊게 공부합니다. 피티반은 학생의 진도와 속도, 목표에 맞춰 개인별로 진행합니다. 상담과 레벨테스트 후 가장 알맞은 반을 안내해 드립니다.'},
      {title:'매쓰그립의 경쟁력',duration:14.33,text:'좋은 수업은 수업 시간으로 끝나지 않습니다. 매쓰그립은 경험 많은 강사진, 생각을 쓰는 훈련, 일대일 피드백, 학부모와의 투명한 소통, 학습 데이터, 꾸준한 관리가 하나의 과정으로 이어집니다.'},
      {title:'학생 변화 사례',duration:16.81,text:'한 중학교 이학년 학생의 변화입니다. 개념이 흩어져 있고 서술형을 포기하던 학생이, 세 달 동안 디디, 피티, 디더블유, 디씨 과정을 반복했습니다. 점수뿐 아니라 풀이 습관과 수학에 대한 자신감도 함께 달라졌습니다.'},
      {title:'4주 내신 대비',duration:15.54,text:'내신 준비는 시험 직전에 문제만 많이 푸는 방식으로 완성되지 않습니다. 첫 주에는 개념과 교과서를 정리하고, 둘째 주에는 학교별 기출과 서술형을 분석합니다. 이후 고난도 실전과 오답 점검까지 네 단계로 준비합니다.'},
      {title:'자주 묻는 질문',duration:16.21,text:'입학 전에는 무료 레벨테스트를 통해 현재 실력과 학습 태도를 함께 살펴봅니다. 숙제는 배운 내용을 자기 것으로 만드는 데 필요한 분량으로 구성합니다. 정원과 시작 시기, 학생 관리에 관한 자세한 내용은 상담에서 안내해 드립니다.'},
      {title:'입학상담 신청',duration:14.87,text:'이제 우리 아이에게 맞는 공부의 방향을 확인해 보세요. 상담을 통해 현재 실력과 학습 습관을 살펴보고, 가장 알맞은 반과 학습 계획을 안내해 드리겠습니다. 화면의 입학상담 신청 버튼을 눌러 주세요.'}
    ].map((s,i)=>({...s,index:i,image:`assets/math-grip-guide/slides/slide-${String(i+1).padStart(2,'0')}.png`,audio:`assets/math-grip-guide/audio/slide-${String(i+1).padStart(2,'0')}.wav`}));
    const el=id=>document.getElementById(id),track=el('track'),dots=el('dots'),viewport=el('viewport'),audio=el('audio'),playBtn=el('playBtn'),prevBtn=el('prevBtn'),nextBtn=el('nextBtn'),counter=el('counter'),slideTitle=el('slideTitle'),time=el('time'),timeline=el('timeline'),timelineFill=el('timelineFill'),autoBtn=el('autoBtn'),scriptBtn=el('scriptBtn'),transcriptSheet=el('transcriptSheet'),transcriptTitle=el('transcriptTitle'),transcriptText=el('transcriptText'),live=el('live');
    let index=Math.max(0,Math.min(slides.length-1,Number((location.hash.match(/slide-(\d+)/)||[])[1]||1)-1)),started=false,autoNext=true,dragStartX=null,isDragging=false;

    const fmt=v=>{const s=Math.max(0,Math.floor(Number(v)||0));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},currentDuration=()=>Number.isFinite(audio.duration)?audio.duration:slides[index].duration;
    function updateProgress(){const d=currentDuration(),r=d?Math.min(1,audio.currentTime/d):0;timelineFill.style.width=`${r*100}%`;timeline.setAttribute('aria-valuenow',String(Math.round(r*100)));time.textContent=`${fmt(audio.currentTime)} / ${fmt(d)}`}
    function updateUI(){track.style.transform=`translateX(${-index*100}%)`;[...dots.children].forEach((dot,i)=>dot.classList.toggle('active',i===index));prevBtn.disabled=index===0;nextBtn.disabled=index===slides.length-1;counter.textContent=`${String(index+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;slideTitle.textContent=slides[index].title;transcriptTitle.textContent=`${index+1}장 · ${slides[index].title}`;transcriptText.textContent=slides[index].text;live.textContent=`${index+1}장, ${slides[index].title}`;history.replaceState(null,'',`#slide-${index+1}`)}
    async function loadAndPlay(shouldPlay){const src=new URL(slides[index].audio,location.href).href;if(audio.src!==src){audio.src=slides[index].audio;audio.load()}audio.currentTime=0;updateProgress();if(shouldPlay&&started){try{await audio.play()}catch(error){playBtn.textContent='▶';playBtn.setAttribute('aria-label','음성 재생')}}}
    function goTo(next,play=started){const target=Math.max(0,Math.min(slides.length-1,next));if(target===index){if(play&&audio.paused)audio.play().catch(()=>{});return}audio.pause();index=target;updateUI();loadAndPlay(play)}
    playBtn.addEventListener('click',async()=>{started=true;if(!audio.src)await loadAndPlay(false);if(audio.paused)audio.play().catch(()=>{});else audio.pause()});audio.addEventListener('play',()=>{playBtn.textContent='❚❚';playBtn.setAttribute('aria-label','음성 일시정지')});audio.addEventListener('pause',()=>{playBtn.textContent='▶';playBtn.setAttribute('aria-label','음성 재생')});audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('loadedmetadata',updateProgress);audio.addEventListener('ended',()=>{updateProgress();if(autoNext&&index<slides.length-1)setTimeout(()=>goTo(index+1,true),450)});
    prevBtn.addEventListener('click',()=>goTo(index-1,true));nextBtn.addEventListener('click',()=>goTo(index+1,true));autoBtn.addEventListener('click',()=>{autoNext=!autoNext;autoBtn.setAttribute('aria-pressed',String(autoNext));autoBtn.setAttribute('aria-label',`자동 넘김 ${autoNext?'켜짐':'꺼짐'}`)});
    function toggleScript(force){const open=typeof force==='boolean'?force:!transcriptSheet.classList.contains('open');transcriptSheet.classList.toggle('open',open);transcriptSheet.setAttribute('aria-hidden',String(!open));scriptBtn.setAttribute('aria-pressed',String(open))}scriptBtn.addEventListener('click',()=>toggleScript());el('closeScript').addEventListener('click',()=>toggleScript(false));
    timeline.addEventListener('click',e=>{const b=timeline.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*currentDuration()});timeline.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();audio.currentTime=Math.max(0,Math.min(currentDuration(),audio.currentTime+(e.key==='ArrowRight'?5:-5)))}});
    viewport.addEventListener('pointerdown',e=>{dragStartX=e.clientX;isDragging=true;viewport.setPointerCapture?.(e.pointerId)});viewport.addEventListener('pointerup',e=>{if(!isDragging)return;const delta=e.clientX-dragStartX;isDragging=false;dragStartX=null;if(Math.abs(delta)>48)goTo(index+(delta<0?1:-1),true)});viewport.addEventListener('pointercancel',()=>{isDragging=false;dragStartX=null});
    document.addEventListener('keydown',e=>{if(transcriptSheet.classList.contains('open')&&e.key==='Escape'){toggleScript(false);return}if(e.key==='ArrowRight')goTo(index+1,true);if(e.key==='ArrowLeft')goTo(index-1,true);if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'){e.preventDefault();playBtn.click()}});
    el('startBtn').addEventListener('click',async()=>{started=true;el('startLayer').classList.add('hidden');updateUI();await loadAndPlay(true)});el('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});updateUI();loadAndPlay(false);
  </script>
</body>
